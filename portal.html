<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Your Project Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0A1628;--blue:#2D7FF9;--amber:#F9A825;--green:#2E9B5B;--ink:#0A1628;--muted:#5A6B7D;--line:#e6ecf3;--bg:#eef2f7;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 60px}
.sora{font-family:'Sora',sans-serif}
a{color:var(--blue);text-decoration:none}
/* login */
#login{max-width:400px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px 26px;box-shadow:0 14px 40px rgba(10,22,40,.10)}
#login h1{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;margin-bottom:4px}
#login p{color:var(--muted);font-size:14px;margin-bottom:20px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.fld input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;font-size:15px;font-family:inherit}
.fld input:focus{outline:none;border-color:var(--blue)}
.btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:#1f6fe0}
.err{color:#D32F2F;font-size:13px;margin-top:10px;min-height:16px;font-weight:600}
/* project */
#project{display:none}
.phero{background:linear-gradient(135deg,var(--navy),#16294a);color:#fff;border-radius:0 0 22px 22px;padding:26px 20px 24px;margin:0 -16px 20px;box-shadow:0 10px 34px rgba(10,22,40,.16)}
.phero .co{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.phero h1{font-family:'Sora',sans-serif;font-size:25px;font-weight:800;line-height:1.15}
.phero .loc{font-size:13.5px;color:#a9bbd4;margin-top:3px}
.ring-row{display:flex;align-items:center;gap:18px;margin-top:20px}
.ring{position:relative;width:88px;height:88px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;font-size:21px}
.next-box{flex:1}
.next-box .nl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#8fa2bd;font-weight:600}
.next-box .nv{font-size:16px;font-weight:700;margin-top:2px}
.next-box .st{display:inline-block;margin-top:8px;background:rgba(45,127,249,.18);color:#8fc0ff;font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;text-transform:capitalize}
/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(10,22,40,.04)}
.card h2{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h2 .cnt{color:var(--muted);font-weight:600;font-size:13px}
/* milestones */
.ms{display:flex;align-items:flex-start;gap:12px;padding:7px 0}
.ms-dot{width:20px;height:20px;border-radius:50%;border:2px solid #cdd8e6;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.ms-dot.done{background:var(--green);border-color:var(--green)}
.ms-dot.current{border-color:var(--blue);box-shadow:0 0 0 4px rgba(45,127,249,.15)}
.ms-line{flex:1}
.ms-l{font-size:14px;font-weight:600}
.ms.current .ms-l{color:var(--blue)}
.ms.upcoming .ms-l{color:#9aa7b6;font-weight:500}
.ms-tag{font-size:11px;font-weight:700;color:var(--blue)}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:18px}
.tl-item::before{content:'';position:absolute;left:-19px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.tl-date{font-size:12px;color:var(--muted);font-weight:600}
.tl-note{font-size:14px;margin:3px 0 8px}
.tl-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}
.tl-photos img{width:100%;height:92px;object-fit:cover;border-radius:9px;cursor:pointer;background:#e7edf4}
/* rows */
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f1f4f8}
.row:last-child{border-bottom:none}
.row-t{font-size:14px;font-weight:600}
.row-s{font-size:12.5px;color:var(--muted)}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:capitalize}
.b-sent{background:#fff4e0;color:#9a6a00}.b-approved{background:#e7f6ee;color:#1c7a43}.b-declined{background:#fdeaea;color:#c0392b}.b-paid{background:#e7f6ee;color:#1c7a43}
.mini{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.mini.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.mini.decline{background:#fff;border:1.5px solid #f0c9c9;color:#c0392b}
/* messages */
.msg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:14px;margin-bottom:8px;line-height:1.4}
.msg.client{background:var(--blue);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.msg.contractor{background:#eef2f7;color:var(--ink);border-bottom-left-radius:5px}
.msg-d{font-size:10.5px;opacity:.7;margin-top:3px}
.msg-form{display:flex;gap:8px;margin-top:12px}
.msg-form input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit}
.empty{color:var(--muted);font-size:13.5px;padding:4px 0}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(10,22,40,.92);z-index:100;align-items:center;justify-content:center;padding:20px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <!-- LOGIN -->
  <div id="login">
    <h1>Your Project Portal</h1>
    <p>Enter your email and the access code your contractor gave you.</p>
    <div class="fld"><label>Email</label><input type="email" id="pEmail" placeholder="you@email.com" autocomplete="email"></div>
    <div class="fld"><label>Access code</label><input type="text" id="pCode" placeholder="e.g. 4F9K2A" autocomplete="one-time-code"></div>
    <button class="btn" id="pBtn" onclick="loadProject()">View my project</button>
    <div class="err" id="pErr"></div>
  </div>

  <!-- PROJECT -->
  <div id="project"></div>
</div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"><img id="lightboxImg" src="" alt=""></div>

<script>
var CODE='', EMAIL='';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function money(n){return '$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});}
function fmtD(d){ if(!d)return''; try{var x=new Date(d);if(!isNaN(x))return x.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}catch(e){} return String(d).slice(0,10); }
function api(action, extra, cb){
  var body=Object.assign({action:action, code:CODE, email:EMAIL}, extra||{});
  fetch('/api/clientportal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(cb).catch(function(){cb({ok:false,error:'Network error. Please try again.'});});
}
function loadProject(){
  EMAIL=(document.getElementById('pEmail').value||'').trim();
  CODE=(document.getElementById('pCode').value||'').trim();
  var err=document.getElementById('pErr'); err.textContent='';
  if(!CODE){err.textContent='Please enter your access code.';return;}
  var btn=document.getElementById('pBtn'); btn.disabled=true; btn.textContent='Loading\u2026';
  api('view', {}, function(d){
    btn.disabled=false; btn.textContent='View my project';
    if(!d||!d.ok){ err.textContent=(d&&d.error)||'Could not load your project.'; return; }
    try{ localStorage.setItem('om_portal_code',CODE); localStorage.setItem('om_portal_email',EMAIL); }catch(e){}
    render(d.project);
  });
}
function ring(pct){
  var r=38, c=2*Math.PI*r, off=c*(1-(pct/100));
  return '<div class="ring"><svg width="88" height="88" viewBox="0 0 88 88"><circle cx="44" cy="44" r="'+r+'" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="8"/><circle cx="44" cy="44" r="'+r+'" fill="none" stroke="#2D7FF9" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/></svg><div class="pct">'+pct+'%</div></div>';
}
function render(p){
  document.getElementById('login').style.display='none';
  var el=document.getElementById('project'); el.style.display='block';
  var h='';
  // hero
  h+='<div class="phero"><div class="co">'+esc(p.company||'Your Contractor')+'</div><h1 class="sora">'+esc(p.name)+'</h1>'+(p.location?'<div class="loc">'+esc(p.location)+'</div>':'')+
     '<div class="ring-row">'+ring(p.progress||0)+'<div class="next-box"><div class="nl">Up next</div><div class="nv">'+esc(p.nextStep||'\u2014')+'</div><span class="st">'+esc((p.status||'in progress').replace(/_/g,' '))+'</span></div></div></div>';
  // milestones
  if(p.milestones&&p.milestones.length){
    h+='<div class="card"><h2>Project roadmap</h2>';
    h+=p.milestones.map(function(m){ var cls=m.done?'done':(m.current?'current':'upcoming'); var dot=m.done?'\u2713':(m.current?'':''); return '<div class="ms '+cls+'"><div class="ms-dot '+cls+'">'+dot+'</div><div class="ms-line"><div class="ms-l">'+esc(m.label)+'</div>'+(m.current?'<div class="ms-tag">In progress now</div>':'')+'</div></div>'; }).join('');
    h+='</div>';
  }
  // photo timeline
  h+='<div class="card"><h2>Progress updates <span class="cnt">'+(p.updates?p.updates.length:0)+'</span></h2>';
  if(p.updates&&p.updates.length){
    h+='<div class="tl">'+p.updates.slice().reverse().map(function(u){
      var ph=(u.photos&&u.photos.length)?('<div class="tl-photos">'+u.photos.map(function(x){return '<img src="'+esc(x.url)+'" onclick="zoom(this.src)">';}).join('')+'</div>'):'';
      return '<div class="tl-item"><div class="tl-date">'+esc(fmtD(u.date))+'</div><div class="tl-note">'+esc(u.note||'')+'</div>'+ph+'</div>';
    }).join('')+'</div>';
  } else { h+='<div class="empty">No updates posted yet. Your contractor will share progress and photos here.</div>'; }
  h+='</div>';
  // approvals (change orders)
  if(p.changeOrders&&p.changeOrders.length){
    h+='<div class="card"><h2>Approvals needed <span class="cnt">'+p.changeOrders.length+'</span></h2>';
    h+=p.changeOrders.map(function(c){
      var acts = (c.status==='sent') ? ('<div style="display:flex;gap:8px;margin-top:10px;"><button class="mini" onclick="decide(\''+c.id+'\',\'approved\')">Approve '+money(c.total)+'</button><button class="mini decline" onclick="decide(\''+c.id+'\',\'declined\')">Decline</button></div>') : ('<span class="badge b-'+c.status+'">'+c.status+(c.approvedBy?(' \u00b7 '+esc(c.approvedBy)):'')+'</span>');
      return '<div style="padding:10px 0;border-bottom:1px solid #f1f4f8;"><div class="row-t">'+esc(c.title||('Change Order '+(c.number||'')))+' \u2014 '+money(c.total)+'</div>'+(c.desc?'<div class="row-s" style="margin:3px 0;">'+esc(c.desc)+'</div>':'')+acts+'</div>';
    }).join('');
    h+='</div>';
  }
  // invoices
  if(p.invoices&&p.invoices.length){
    h+='<div class="card"><h2>Invoices <span class="cnt">'+p.invoices.length+'</span></h2>';
    h+=p.invoices.map(function(v){ return '<div class="row"><div><div class="row-t">Invoice '+esc(v.number||'')+'</div><div class="row-s">'+esc(fmtD(v.date))+'</div></div><div style="text-align:right;"><div class="row-t">'+money(v.total)+'</div><span class="badge b-'+esc(v.status)+'">'+esc(v.status)+'</span></div></div>'; }).join('');
    h+='</div>';
  }
  // messages
  h+='<div class="card"><h2>Messages</h2><div id="msgList">'+renderMsgs(p.messages||[])+'</div>'+
     '<div class="msg-form"><input type="text" id="msgInput" placeholder="Message your contractor\u2026" onkeydown="if(event.key===\'Enter\')sendMsg()"><button class="mini" onclick="sendMsg()">Send</button></div></div>';
  h+='<div class="foot">Powered by Orchamind</div>';
  el.innerHTML=h;
  window.scrollTo(0,0);
}
function renderMsgs(msgs){
  if(!msgs||!msgs.length) return '<div class="empty">No messages yet. Send your contractor a note below \u2014 they\u2019ll get it right away.</div>';
  return msgs.map(function(m){ var who=(m.from==='client')?'client':'contractor'; return '<div class="msg '+who+'">'+esc(m.text)+'<div class="msg-d">'+esc(fmtD(m.date))+'</div></div>'; }).join('');
}
function sendMsg(){
  var inp=document.getElementById('msgInput'); var t=(inp.value||'').trim(); if(!t)return;
  inp.value=''; inp.disabled=true;
  api('message', {text:t}, function(d){
    inp.disabled=false;
    if(d&&d.ok){ api('view',{},function(r){ if(r&&r.ok){ document.getElementById('msgList').innerHTML=renderMsgs(r.project.messages||[]); } }); }
    else { inp.value=t; alert((d&&d.error)||'Could not send.'); }
  });
}
function decide(coId, decision){
  var signer='';
  if(decision==='approved'){
    signer=prompt('Type your full name to approve \u2014 this acts as your signature:','');
    if(signer===null) return;
    signer=(signer||'').trim();
    if(!signer){ alert('A typed name is required to approve.'); return; }
  } else {
    if(!confirm('Decline this change order?')) return;
  }
  api('co', {coId:coId, decision:decision, name:signer}, function(d){
    if(d&&d.ok){ loadProject(); } else { alert((d&&d.error)||'Could not record your decision.'); }
  });
}
function zoom(src){ var lb=document.getElementById('lightbox'); document.getElementById('lightboxImg').src=src; lb.classList.add('show'); }
// auto-login if we have saved creds
(function(){ try{ var sc=localStorage.getItem('om_portal_code'), se=localStorage.getItem('om_portal_email'); if(sc){ document.getElementById('pCode').value=sc; if(se)document.getElementById('pEmail').value=se; } }catch(e){} })();
</script>
</body></html>

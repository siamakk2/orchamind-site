name: Validate app

# Two guards, born from real production incidents:
#   validate-app.js      - an unescaped </script> inside a JS string silently
#                          truncated a 101 KB block and killed the entire
#                          estimating engine in production.
#   check-reachability.js - controls became unreachable (render button inside a
#                          collapsed box, Save scrolled off a 5,000px modal)
#                          while every unit test still passed.
on:
  # Every branch, not just the deploy branch. A guard that only runs after the
  # code has already shipped is a report, not a gate.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jsdom (needed by the reachability check)
        run: npm install --no-save jsdom@24

      - name: Inline scripts parse, files in sync, no stray hosts
        run: node scripts/validate-app.js

      - name: Every primary action is on screen and operable
        run: node scripts/check-reachability.js

      - name: Takeoff scoring is honest
        run: node scripts/test-bench-score.js

      - name: Plan cross-check catches misreads
        run: node scripts/test-plan-crosscheck.js

      - name: Cross-check warning reaches the screen
        run: node scripts/test-crosscheck-ui.js

      - name: Walkthrough geometry matches the plan
        run: node scripts/test-house-walk.js

      - name: Walkthrough is reachable and wired to Selections
        run: node scripts/test-walk-ui.js

      - name: Quantity math is code and rounds up
        run: node scripts/test-takeoff-quantities.js
